<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Frame Test</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
  }
  #frameCanvas {
    display: block;
    width: 100vw;
    height: 100vh;
  }
</style>
</head>
<body>
<canvas id="frameCanvas"></canvas>

<script>
(function () {
  "use strict";

  var FRAME_SRC = "assets/frames/frame_0001.webp";

  var canvas = document.getElementById("frameCanvas");
  var ctx = canvas.getContext("2d");
  var dpr = Math.min(window.devicePixelRatio || 1, 2);

  var img = new Image();
  var cssWidth = 0;
  var cssHeight = 0;

  function resizeCanvas() {
    cssWidth = window.innerWidth;
    cssHeight = window.innerHeight;

    canvas.width = Math.round(cssWidth * dpr);
    canvas.height = Math.round(cssHeight * dpr);

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  // object-fit: cover 방식으로 이미지가 화면을 꽉 채우도록 그린다
  function drawCover() {
    if (!img.naturalWidth) return;

    var iw = img.naturalWidth;
    var ih = img.naturalHeight;
    var imgRatio = iw / ih;
    var canvasRatio = cssWidth / cssHeight;

    var sx, sy, sw, sh;

    if (imgRatio > canvasRatio) {
      sh = ih;
      sw = ih * canvasRatio;
      sx = (iw - sw) / 2;
      sy = 0;
    } else {
      sw = iw;
      sh = iw / canvasRatio;
      sx = 0;
      sy = (ih - sh) / 2;
    }

    ctx.clearRect(0, 0, cssWidth, cssHeight);
    ctx.drawImage(img, sx, sy, sw, sh, 0, 0, cssWidth, cssHeight);
  }

  function render() {
    resizeCanvas();
    drawCover();
  }

  img.onload = render;
  img.onerror = function () {
    console.error("이미지를 불러오지 못했습니다: " + FRAME_SRC);
  };
  img.src = FRAME_SRC;

  window.addEventListener("resize", render);
})();
</script>
</body>
</html>
