<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Scroll Scrub Test (main2)</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 700vh;
    background: #000;
  }
  #stage {
    position: sticky;
    top: 0;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
  }
  #frameCanvas {
    display: block;
    width: 100%;
    height: 100%;
  }
</style>
</head>
<body>
<div id="stage">
  <canvas id="frameCanvas"></canvas>
</div>

<script>
(function () {
  "use strict";

  var FRAME_TOTAL = 192;
  var FRAME_PATH = function (i) {
    return "frames-main2/frame_" + String(i).padStart(4, "0") + ".webp";
  };

  var canvas = document.getElementById("frameCanvas");
  var ctx = canvas.getContext("2d");
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  var cssWidth = 0;
  var cssHeight = 0;

  // ① 정적 이미지 - canvas가 화면 전체를 꽉 채우도록 DPR 대응 사이즈 세팅
  function resizeCanvas() {
    cssWidth = window.innerWidth;
    cssHeight = window.innerHeight;
    canvas.width = Math.round(cssWidth * dpr);
    canvas.height = Math.round(cssHeight * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  // object-fit: cover 방식으로 왜곡 없이 그리기
  function drawCover(img) {
    if (!img || !img.naturalWidth) return;
    var iw = img.naturalWidth;
    var ih = img.naturalHeight;
    var imgRatio = iw / ih;
    var canvasRatio = cssWidth / cssHeight;
    var sx, sy, sw, sh;

    if (imgRatio > canvasRatio) {
      sh = ih;
      sw = ih * canvasRatio;
      sx = (iw - sw) / 2;
      sy = 0;
    } else {
      sw = iw;
      sh = iw / canvasRatio;
      sx = 0;
      sy = (ih - sh) / 2;
    }

    ctx.clearRect(0, 0, cssWidth, cssHeight);
    ctx.drawImage(img, sx, sy, sw, sh, 0, 0, cssWidth, cssHeight);
  }

  var images = new Array(FRAME_TOTAL);
  var loadedCount = 0;
  var imagesReady = false;
  var currentFrame = -1;

  function renderFrame(index) {
    var img = images[index];
    if (!img) return;
    drawCover(img);
    currentFrame = index;
  }

  // ③ 프레임 preload - 전체 로딩 완료 전까지는 frame_0001만 표시
  function preloadFrames() {
    for (var i = 1; i <= FRAME_TOTAL; i++) {
      (function (index) {
        var img = new Image();
        img.onload = img.onerror = function () {
          loadedCount++;
          if (index === 0 && currentFrame === -1) {
            renderFrame(0);
          }
          if (loadedCount === FRAME_TOTAL) {
            imagesReady = true;
          }
        };
        img.src = FRAME_PATH(index + 1);
        images[index] = img;
      })(i - 1);
    }
  }

  // ② 스크롤 진행률(0~1) 계산
  function getProgress() {
    var scrollY = window.scrollY || window.pageYOffset;
    var maxScroll = document.body.scrollHeight - window.innerHeight;
    var p = maxScroll > 0 ? scrollY / maxScroll : 0;
    if (p < 0) p = 0;
    if (p > 1) p = 1;
    return p;
  }

  var ticking = false;
  function onScroll() {
    if (ticking) return;
    ticking = true;
    requestAnimationFrame(function () {
      var progress = getProgress();
      console.log("scroll progress:", progress.toFixed(3));

      // ③ 진행률 -> 프레임 인덱스 매핑, 동일 프레임 중복 렌더링 방지
      if (imagesReady) {
        var frameIndex = Math.floor(progress * (FRAME_TOTAL - 1));
        if (frameIndex !== currentFrame) {
          renderFrame(frameIndex);
        }
      }
      ticking = false;
    });
  }

  window.addEventListener("resize", function () {
    resizeCanvas();
    if (currentFrame >= 0) renderFrame(currentFrame);
  });
  window.addEventListener("scroll", onScroll, { passive: true });

  resizeCanvas();
  preloadFrames();
})();
</script>
</body>
</html>
